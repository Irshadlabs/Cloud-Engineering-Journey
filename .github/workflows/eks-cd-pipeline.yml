# -----------------------------------------------------------------------------------
# Workflow: Continuous Deployment (CD) to AWS EKS
# Description: Automates the entire release process. Builds Docker image, 
#              pushes to ECR, and updates the EKS cluster deployment.
# Author: Mohammed Irshad (AWS Solutions Architect)
# -----------------------------------------------------------------------------------

name: EKS Production Deployment

on:
  push:
    branches: [ main ] # Trigger on every push to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/irshadlabs-repo:$IMAGE_TAG .
          docker push $ECR_REGISTRY/irshadlabs-repo:$IMAGE_TAG

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name irshadlabs-eks-cluster

      - name: Deploy to EKS
        run: |
          # Updating the image in the deployment manifest dynamically
          sed -i 's|image:.*|image: '${{ steps.login-ecr.outputs.registry }}'/irshadlabs-repo:'${{ github.sha }}'|' architecture/eks-cluster/manifests/nginx-deployment.yaml
          kubectl apply -f architecture/eks-cluster/manifests/
