# -----------------------------------------------------------------------------------
# Resource: Istio VirtualService & DestinationRule
# Description: Implements a Canary Release strategy by splitting traffic 90/10 
#              between stable (v1) and experimental (v2) versions of an app.
# Author: Mohammed Irshad (AWS Solutions Architect)
# -----------------------------------------------------------------------------------

apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: web-app-destination
spec:
  host: my-web-service
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: web-app-traffic-split
spec:
  hosts:
    - my-web-service
  http:
    - route:
        - destination:
            host: my-web-service
            subset: v1
          weight: 90 # 90% Traffic goes to stable version
        - destination:
            host: my-web-service
            subset: v2
          weight: 10 # 10% Traffic goes to new version for testing
